<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PPL Workout Tracker</title>
    <style>
        :root {
            --bg-dark: #121214; --card-bg: #1e1e24; --text-main: #f3f4f6; --text-muted: #9ca3af;
            --primary: #ef4444; --pull-blue: #3b82f6; --legs-green: #10b981; --border: #2d2d34;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 60px; }
        header { background-color: var(--card-bg); padding: 16px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); text-align: center; font-weight: 700; }
        .day-nav { display: flex; overflow-x: auto; background-color: #17171c; padding: 8px; gap: 6px; }
        .day-nav::-webkit-scrollbar { display: none; }
        .day-btn { background-color: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
        .day-btn.active[data-type="push"] { background-color: var(--primary); color: white; border-color: var(--primary); }
        .day-btn.active[data-type="pull"] { background-color: var(--pull-blue); color: white; border-color: var(--pull-blue); }
        .day-btn.active[data-type="legs"] { background-color: var(--legs-green); color: white; border-color: var(--legs-green); }
        .container { padding: 16px; max-width: 500px; margin: 0 auto; }
        .day-title-banner { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .exercise-card { background-color: #1a1a20; margin-bottom: 24px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .image-gallery { display: flex; padding: 12px; gap: 10px; background: #fff; }
        .image-card { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px; height: 160px; background: #f9fafb; }
        .body-svg { height: 100%; width: auto; }
        .image-source-tag { position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.6); color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .exercise-info { padding: 12px; border-bottom: 1px solid var(--border); }
        .exercise-name { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .exercise-desc { font-size: 0.85rem; color: #a1a1aa; line-height: 1.4; }
        .sets-container { padding: 12px; }
        .sets-grid { display: grid; grid-template-columns: 40px 1fr 1fr 70px; gap: 8px; align-items: center; margin-bottom: 8px; }
        .grid-header { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; text-align: center; }
        .set-num { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); text-align: center; }
        input { background-color: #121214; border: 1px solid #3f3f46; color: white; padding: 8px; border-radius: 6px; text-align: center; font-size: 0.95rem; width: 100%; font-weight: 600; }
        .log-btn { background-color: #27272a; color: #fff; border: 1px solid #3f3f46; padding: 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .log-btn.logged { background-color: var(--primary); border-color: var(--primary); }
        .pull-theme .log-btn.logged { background-color: var(--pull-blue); border-color: var(--pull-blue); }
        .legs-theme .log-btn.logged { background-color: var(--legs-green); border-color: var(--legs-green); }
        .danger-btn { display: block; width: 100%; background: none; border: 1px solid #ef4444; border-radius: 8px; color: #ef4444; padding: 12px; margin-top: 24px; text-align: center; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <header>⚡ PPL WORKOUT TRACKER</header>

    <nav class="day-nav" id="dayNav">
        <button class="day-btn active" data-day="1" data-type="push">Day 1: Push</button>
        <button class="day-btn" data-day="2" data-type="pull">Day 2: Pull</button>
        <button class="day-btn" data-day="3" data-type="legs">Day 3: Legs</button>
        <button class="day-btn" data-day="4" data-type="push">Day 4: Push</button>
        <button class="day-btn" data-day="5" data-type="pull">Day 5: Pull</button>
        <button class="day-btn" data-day="6" data-type="legs">Day 6: Legs</button>
    </nav>

    <div class="container" id="themeContainer">
        <div class="day-title-banner" id="dayTitleText">Loading...</div>
        <div id="workoutContainer"></div>
        <button class="danger-btn" onclick="clearAllLogs()">Reset All Saved Data</button>
    </div>
